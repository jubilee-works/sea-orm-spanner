[workspace]

[package]
name = "basic-crud"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sea-orm-spanner = { path = "../..", features = ["with-chrono", "with-uuid"] }
sea-orm = { version = "2.0.0-rc.41", features = [
    "macros",
    "with-chrono",
    "with-uuid",
    "runtime-tokio-native-tls",
] }
gcloud-spanner = "1.7.0"
gcloud-googleapis = { version = "1.3.0", features = ["spanner"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# TEMPORARY: see the note in the root Cargo.toml. Keeps this example's
# sea-query in sync with the patched lenient-integer build of the library.
[patch.crates-io]
sea-query = { git = "https://github.com/devgony/sea-query", rev = "dca2f6a79a250ed95e09bc9a595081fa9d0490f5" }
